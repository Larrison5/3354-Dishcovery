{% extends 'base.html' %}{% block content %}<h1>Your matches</h1><section class="grid">{% for x in results %}<article class="card"><h2>{{x.restaurant.name}}</h2><p>Score: {{x.score}}</p><ul>{% for reason in x.reasons %}<li>{{reason}}</li>{% endfor %}</ul><a class="btn" href="{{url_for('restaurants.profile',i=x.restaurant.id)}}">View profile</a></article>{% endfor %}</section>{% endblock %}
