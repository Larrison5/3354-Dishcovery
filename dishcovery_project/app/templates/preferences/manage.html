{% extends 'base.html' %}{% block content %}<form class="card form" method="post"><h1>Dining preferences</h1><input name="cuisine" placeholder="Cuisine" value="{{preference.cuisine if preference else ''}}"><input name="location" placeholder="Location" value="{{preference.location if preference else ''}}"><select name="max_price_level"><option value="">Any price</option>{% for n in [1,2,3,4] %}<option value="{{n}}" {% if preference and preference.max_price_level==n %}selected{% endif %}>{{'$'*n}}</option>{% endfor %}</select><input type="number" step=".1" min="0" max="5" name="minimum_rating" placeholder="Minimum rating" value="{{preference.minimum_rating if preference and preference.minimum_rating is not none else ''}}"><input name="dietary_options" placeholder="vegetarian, halal, gluten-free" value="{{preference.dietary_options if preference else ''}}"><button>Save and find matches</button></form>{% endblock %}
