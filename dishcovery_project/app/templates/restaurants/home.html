{% extends 'base.html' %}{% block content %}<h1>Find restaurants</h1><form class="card grid"><input name="name" placeholder="Name"><input name="cuisine" placeholder="Cuisine"><input name="location" placeholder="Location"><select name="max_price"><option value="">Any price</option><option value="1">$</option><option value="2">$$</option><option value="3">$$$</option><option value="4">$$$$</option></select><input name="min_rating" type="number" step=".1" min="0" max="5" placeholder="Minimum rating"><button>Search</button></form><section class="grid">{% for r in restaurants %}<article class="card"><h2>{{r.name}}</h2><p>{{r.cuisine}} · {{r.location}}</p><p>{{'$'*r.price_level}} · ⭐ {{r.rating}}</p><p>{{r.description}}</p><a class="btn" href="{{url_for('restaurants.profile',i=r.id)}}">View profile</a></article>{% else %}<p>No matches.</p>{% endfor %}</section>{% endblock %}
