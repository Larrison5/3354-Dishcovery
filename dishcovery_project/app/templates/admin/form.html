{% extends 'base.html' %}{% block content %}<form class="card form" method="post"><h1>{{action}} restaurant</h1>{% for n in ['name','cuisine','location','address','hours','dietary_options'] %}<input name="{{n}}" placeholder="{{n|replace('_',' ')|title}}" value="{{restaurant[n] if restaurant else ''}}" {% if n!='dietary_options' %}required{% endif %}>{% endfor %}<select name="price_level">{% for n in [1,2,3,4] %}<option value="{{n}}" {% if restaurant and restaurant.price_level==n %}selected{% endif %}>{{'$'*n}}</option>{% endfor %}</select><input type="number" min="0" max="5" step=".1" name="rating" value="{{restaurant.rating if restaurant else 0}}"><textarea name="menu" placeholder="Menu">{{restaurant.menu if restaurant else ''}}</textarea><textarea name="description" placeholder="Description">{{restaurant.description if restaurant else ''}}</textarea><button>{{action}}</button></form>{% endblock %}
