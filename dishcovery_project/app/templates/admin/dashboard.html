{% extends 'base.html' %}{% block content %}<h1>Restaurant administration</h1><a class="btn" href="{{url_for('admin.add')}}">Add restaurant</a><table class="card"><tr><th>Name</th><th>Cuisine</th><th>Actions</th></tr>{% for r in restaurants %}<tr><td>{{r.name}}</td><td>{{r.cuisine}}</td><td><a href="{{url_for('admin.edit',i=r.id)}}">Edit</a><form class="inline" method="post" action="{{url_for('admin.delete',i=r.id)}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
