<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{% block title %}Dishcovery{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><nav><a href="{{url_for('restaurants.home')}}"><b>Dishcovery</b></a>{% if current_user.is_authenticated %}<a href="{{url_for('preferences.manage')}}">Preferences</a><a href="{{url_for('preferences.matches')}}">Matches</a><a href="{{url_for('favorites.listing')}}">Favorites</a>{% if current_user.is_admin() %}<a href="{{url_for('admin.dashboard')}}">Admin</a>{% endif %}<a href="{{url_for('auth.logout')}}">Logout</a>{% else %}<a href="{{url_for('auth.login')}}">Login</a><a href="{{url_for('auth.register')}}">Register</a>{% endif %}</nav><main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
