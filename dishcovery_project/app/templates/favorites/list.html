{% extends 'base.html' %}{% block content %}<h1>Favorites</h1><section class="grid">{% for f in favorites %}<article class="card"><h2>{{f.restaurant.name}}</h2><a class="btn" href="{{url_for('restaurants.profile',i=f.restaurant.id)}}">View</a><form method="post" action="{{url_for('favorites.remove',i=f.restaurant.id)}}"><button class="danger">Remove</button></form></article>{% else %}<p>No favorites yet.</p>{% endfor %}</section>{% endblock %}
